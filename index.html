<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>קֶשֶׁר v2 · CRM קהילתי — המחלקה לגיוס משאבים וחיזוק הקשר עם קהילות בתפוצות</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
/* ---------- Tokens ---------- */
:root {
  --c-blue: #1E4382;
  --c-blue-dark: #1C3B77;
  --c-blue-deep: #151D66;
  --c-cyan-light: #A7E3F6;
  --c-cyan: #18A1DA;
  --c-amber: #D88B00;
  --c-amber-hover: #B97700;
  --c-mustard: #DBA62A;
  --c-text: #34373E;
  --c-text-strong: #141413;
  --c-text-muted: #808080;
  --c-card: #FAF9F5;
  --c-bg: #FFFFFF;
  --c-border: #DDDDDD;
  --c-border-soft: #ECECEC;
  --c-success: #2E7D5B;
  --c-danger: #B23A48;

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;
  --r-xl: 22px;

  --sh-card: 0 1px 0 rgba(20,29,102,0.04), 0 6px 24px -10px rgba(20,29,102,0.10);
  --sh-deep: 0 10px 40px -12px rgba(20,29,102,0.35);

  --font-display: "Assistant", "Heebo", system-ui, sans-serif;
  --font-body: "Heebo", "Assistant", system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: var(--font-body);
  color: var(--c-text);
  background: #F4F5F8;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
html[dir="rtl"], html[dir="rtl"] body { direction: rtl; }
html[dir="ltr"], html[dir="ltr"] body { direction: ltr; }

button { font-family: inherit; cursor: pointer; }
a { color: inherit; }

/* ---------- App shell ---------- */
.app-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.app-topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: #fff;
  border-bottom: 1px solid var(--c-border);
}

.topbar-inner {
  max-width: 1480px;
  margin: 0 auto;
  padding: 14px 28px;
  display: flex;
  align-items: center;
  gap: 24px;
}

.brand-mark {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-mark .star {
  width: 38px; height: 38px;
  background: var(--c-blue);
  border-radius: 8px;
  display: grid;
  place-items: center;
  color: white;
}
.brand-mark .star svg { width: 22px; height: 22px; }
.brand-mark .text-block {
  line-height: 1.05;
}
.brand-mark .text-block .he {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 17px;
  color: var(--c-blue-deep);
  letter-spacing: -0.01em;
}
.brand-mark .text-block .en {
  font-family: var(--font-body);
  font-size: 10.5px;
  font-weight: 600;
  color: var(--c-text-muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.product-name {
  padding-inline-start: 18px;
  margin-inline-start: 6px;
  border-inline-start: 1px solid var(--c-border);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  color: var(--c-text);
  white-space: nowrap;
}
.product-name span {
  color: var(--c-amber);
  font-weight: 800;
}

.tabs {
  display: flex;
  gap: 4px;
  margin-inline-start: auto;
  background: #F4F5F8;
  padding: 4px;
  border-radius: 12px;
}
.tab {
  border: none;
  background: transparent;
  padding: 10px 18px;
  border-radius: 9px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
  color: var(--c-text);
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.18s ease;
  white-space: nowrap;
}
.tab:hover { color: var(--c-blue); }
.tab.active {
  background: var(--c-blue);
  color: white;
  box-shadow: 0 2px 8px -2px rgba(30,67,130,0.4);
}
.tab .tab-icon { opacity: 0.9; }

.topbar-right {
  display: flex;
  align-items: center;
  gap: 14px;
}
.tenant-switcher {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  border: 1px solid var(--c-border);
  border-radius: 10px;
  background: #fff;
  font-size: 13px;
  font-weight: 600;
  color: var(--c-text);
}
.tenant-switcher > div { white-space: nowrap; }
.super-hero .time-block .now { white-space: nowrap; }
.super-hero .time-block .where { white-space: nowrap; }
.tenant-switcher .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--c-amber);
}
.icon-btn {
  width: 36px; height: 36px;
  border-radius: 10px;
  border: 1px solid var(--c-border);
  background: #fff;
  display: grid; place-items: center;
  color: var(--c-text);
  position: relative;
}
.icon-btn .pip {
  position: absolute;
  top: 5px; right: 5px;
  width: 8px; height: 8px;
  background: var(--c-amber);
  border-radius: 50%;
  border: 2px solid #fff;
}

/* ---- Language toggle ---- */
.lang-toggle {
  display: inline-flex;
  background: #F4F5F8;
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}
.lang-toggle button {
  border: none;
  background: transparent;
  padding: 6px 12px;
  border-radius: 999px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 12px;
  color: var(--c-text);
  cursor: pointer;
  letter-spacing: 0.02em;
  transition: all 0.15s ease;
}
.lang-toggle button:hover { color: var(--c-blue); }
.lang-toggle button.active {
  background: var(--c-blue);
  color: white;
  box-shadow: 0 1px 4px -1px rgba(30,67,130,0.4);
}

/* When LTR — bilingual brand block flips primary/secondary */
html[dir="ltr"] .brand-mark .text-block .he {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--c-text-muted);
  letter-spacing: 0.02em;
  text-transform: none;
  order: 2;
}
html[dir="ltr"] .brand-mark .text-block .en {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 16px;
  color: var(--c-blue-deep);
  letter-spacing: -0.01em;
  text-transform: none;
  order: 1;
}
html[dir="ltr"] .brand-mark .text-block {
  display: flex;
  flex-direction: column;
}

/* In LTR, flip "forward" arrow icons so chevrons point the right way */
html[dir="ltr"] .arrow > svg,
html[dir="ltr"] svg.lt-flip {
  transform: scaleX(-1);
}

/* Tweak iconography for LTR text-flow */
html[dir="ltr"] .ticker .scroll {
  animation-direction: reverse;
}

/* ---------- Screen container ---------- */
.screen {
  max-width: 1480px;
  margin: 0 auto;
  padding: 28px;
  width: 100%;
}

.app-footer {
  background: var(--c-blue-deep);
  color: rgba(255,255,255,0.85);
  font-size: 12.5px;
  padding: 18px 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 40px;
}
.app-footer .left { display: flex; align-items: center; gap: 14px; }
.app-footer .pill {
  background: rgba(167,227,246,0.14);
  color: var(--c-cyan-light);
  padding: 4px 10px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 11.5px;
  letter-spacing: 0.04em;
}

/* ---------- Reusable card ---------- */
.card {
  background: #fff;
  border: 1px solid var(--c-border);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-card);
}
.card-cream {
  background: var(--c-card);
}
.card-pad { padding: 22px; }

.card-eyebrow {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 12px;
  color: var(--c-cyan);
  letter-spacing: 0.06em;
  margin: 0 0 6px 0;
}
.card-title {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 22px;
  color: var(--c-blue-deep);
  margin: 0 0 14px 0;
  letter-spacing: -0.01em;
}

/* ---------- CTA button ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 18px;
  border-radius: 10px;
  border: none;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
  transition: all 0.16s ease;
  text-decoration: none;
}
.btn-primary {
  background: var(--c-amber);
  color: #fff;
  box-shadow: 0 2px 0 rgba(0,0,0,0.04), 0 4px 14px -6px rgba(216,139,0,0.6);
}
.btn-primary:hover { background: var(--c-amber-hover); transform: translateY(-1px); }
.btn-ghost {
  background: transparent;
  color: var(--c-blue);
  border: 1px solid var(--c-border);
}
.btn-ghost:hover { background: #F4F5F8; }
.btn-blue {
  background: var(--c-blue);
  color: #fff;
}
.btn-blue:hover { background: var(--c-blue-dark); }
.btn-sm { padding: 7px 12px; font-size: 12.5px; }
.btn-lg { padding: 14px 24px; font-size: 16px; }

/* ---------- Pattern banner ---------- */
.pattern-banner {
  background: var(--c-blue-dark);
  color: white;
  position: relative;
  overflow: hidden;
  border-radius: var(--r-lg);
}
.pattern-banner::before {
  content: "";
  position: absolute; inset: 0;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(167,227,246,0.18) 1px, transparent 1.5px);
  background-size: 22px 22px;
  pointer-events: none;
}
.pattern-banner > * { position: relative; z-index: 1; }

.tri-pattern {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.18;
}

/* ---------- Pills / chips / tags ---------- */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  background: #EEF1F7;
  color: var(--c-blue-dark);
}
.tag-amber { background: rgba(216,139,0,0.12); color: var(--c-amber); }
.tag-cyan { background: rgba(24,161,218,0.12); color: var(--c-cyan); }
.tag-mustard { background: rgba(219,166,42,0.16); color: #8a6510; }
.tag-success { background: rgba(46,125,91,0.12); color: var(--c-success); }
.tag-danger { background: rgba(178,58,72,0.12); color: var(--c-danger); }

/* ---------- Decorative magen david motif (simple) ---------- */
.magen-corner {
  position: absolute;
  width: 220px; height: 220px;
  pointer-events: none;
  opacity: 0.10;
}

/* ---------- KIOSK SCREEN 1 ---------- */
.kiosk {
  background: #fff;
  border-radius: var(--r-lg);
  overflow: hidden;
  border: 1px solid var(--c-border);
}
.kiosk-hero {
  background: linear-gradient(135deg, #1C3B77 0%, #151D66 100%);
  color: #fff;
  padding: 28px 32px;
  position: relative;
  overflow: hidden;
}
.kiosk-hero-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr 1fr;
  gap: 28px;
  align-items: center;
}
.kiosk-community {
  display: flex;
  align-items: center;
  gap: 18px;
}
.kiosk-community .crest {
  width: 72px; height: 72px;
  background: rgba(167,227,246,0.16);
  border: 1.5px solid rgba(167,227,246,0.4);
  border-radius: 18px;
  display: grid; place-items: center;
  color: var(--c-cyan-light);
}
.kiosk-community .name {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 30px;
  line-height: 1.1;
  letter-spacing: -0.01em;
}
.kiosk-community .place {
  font-size: 14.5px;
  color: var(--c-cyan-light);
  margin-top: 4px;
  letter-spacing: 0.02em;
}
.kiosk-parasha {
  text-align: center;
}
.kiosk-parasha .label {
  font-size: 12px;
  letter-spacing: 0.18em;
  color: var(--c-cyan-light);
  text-transform: uppercase;
}
.kiosk-parasha .name {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 44px;
  letter-spacing: -0.02em;
  margin-top: 6px;
  line-height: 1;
}
.kiosk-parasha .hebdate {
  margin-top: 6px;
  color: rgba(255,255,255,0.75);
  font-size: 14px;
}
.kiosk-shabbat {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(167,227,246,0.25);
  border-radius: var(--r-md);
  padding: 14px 16px;
}
.kiosk-shabbat .row {
  display: flex; justify-content: space-between;
  padding: 6px 0;
  align-items: center;
  border-bottom: 1px dashed rgba(167,227,246,0.18);
}
.kiosk-shabbat .row:last-child { border-bottom: none; }
.kiosk-shabbat .row .label {
  font-size: 13px;
  color: var(--c-cyan-light);
  display: flex; align-items: center; gap: 8px;
}
.kiosk-shabbat .row .time {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 22px;
  font-variant-numeric: tabular-nums;
}

.kiosk-body {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 0;
  background: #fff;
}
.kiosk-col {
  padding: 24px 28px;
}
.kiosk-col + .kiosk-col {
  border-inline-start: 1px solid var(--c-border);
}
.kiosk-section-title {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 22px;
  color: var(--c-blue-deep);
  margin: 0 0 14px 0;
  display: flex;
  align-items: center;
  gap: 10px;
}
.kiosk-section-title .underline-cyan {
  height: 6px; width: 22px;
  background: var(--c-cyan-light);
  border-radius: 4px;
}

.event-row {
  display: grid;
  grid-template-columns: 78px 1fr auto;
  gap: 16px;
  padding: 14px 0;
  border-bottom: 1px solid var(--c-border-soft);
  align-items: center;
}
.event-row:last-child { border-bottom: none; }
.event-date {
  background: var(--c-card);
  border: 1px solid var(--c-border);
  border-radius: 10px;
  padding: 8px 4px;
  text-align: center;
}
.event-date .d {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 26px;
  color: var(--c-blue);
  line-height: 1;
}
.event-date .m {
  font-size: 11px;
  font-weight: 600;
  color: var(--c-text-muted);
  margin-top: 4px;
  letter-spacing: 0.06em;
}
.event-meta .name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 17px;
  color: var(--c-text-strong);
  margin: 0;
}
.event-meta .sub {
  font-size: 13px;
  color: var(--c-text-muted);
  margin-top: 4px;
}
.event-action {
  text-align: end;
}
.event-time {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 18px;
  color: var(--c-blue);
  font-variant-numeric: tabular-nums;
}

.kiddush-card {
  background: linear-gradient(120deg, #FAF9F5 0%, #FFF9EC 100%);
  border: 1px solid #F0E4C7;
  border-radius: var(--r-lg);
  padding: 18px 20px;
  display: flex;
  gap: 16px;
  align-items: center;
  margin-bottom: 18px;
}
.kiddush-card .icon-wrap {
  width: 56px; height: 56px;
  background: rgba(216,139,0,0.12);
  border-radius: 14px;
  display: grid; place-items: center;
  color: var(--c-amber);
  flex-shrink: 0;
}
.kiddush-card .label {
  font-size: 12px;
  color: var(--c-amber);
  font-weight: 700;
  letter-spacing: 0.06em;
}
.kiddush-card .who {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 22px;
  color: var(--c-text-strong);
  line-height: 1.15;
  margin-top: 2px;
}
.kiddush-card .occasion {
  font-size: 13px;
  color: var(--c-text);
  margin-top: 2px;
}

.business-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.business-card {
  background: #fff;
  border: 1px solid var(--c-border);
  border-radius: 10px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.business-card .biz-icon {
  width: 38px; height: 38px;
  background: var(--c-card);
  border-radius: 9px;
  display: grid; place-items: center;
  color: var(--c-blue);
  flex-shrink: 0;
}
.business-card .biz-name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
  color: var(--c-text-strong);
  line-height: 1.1;
}
.business-card .biz-trade {
  font-size: 12px;
  color: var(--c-text-muted);
  margin-top: 2px;
}

.ticker {
  background: var(--c-blue);
  color: #fff;
  padding: 10px 22px;
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 14px;
  overflow: hidden;
  white-space: nowrap;
}
.ticker .badge {
  background: var(--c-amber);
  color: #fff;
  font-weight: 800;
  font-size: 11.5px;
  padding: 3px 10px;
  border-radius: 999px;
  letter-spacing: 0.06em;
  flex-shrink: 0;
}
.ticker .scroll {
  display: inline-flex;
  gap: 36px;
  animation: tickerScroll 38s linear infinite;
  padding-right: 0;
}
.ticker .scroll span {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.ticker .scroll span::before {
  content: "";
  width: 6px; height: 6px;
  background: var(--c-cyan-light);
  border-radius: 50%;
}
@keyframes tickerScroll {
  from { transform: translateX(-50%); }
  to { transform: translateX(0); }
}

/* ---------- MEMBER SCREEN 2 ---------- */
.member-wrap {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 24px;
}
.member-side {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.member-card-hero {
  background: linear-gradient(160deg, #1E4382 0%, #151D66 100%);
  color: #fff;
  border-radius: var(--r-lg);
  padding: 22px;
  position: relative;
  overflow: hidden;
}
.member-card-hero .avatar {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: var(--c-cyan-light);
  color: var(--c-blue-deep);
  display: grid; place-items: center;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 24px;
  margin-bottom: 14px;
}
.member-card-hero .hi {
  font-size: 12.5px;
  color: var(--c-cyan-light);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.member-card-hero .name {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 22px;
  margin: 4px 0 2px;
  letter-spacing: -0.01em;
}
.member-card-hero .role {
  font-size: 13px;
  color: rgba(255,255,255,0.78);
}
.member-card-hero .stats-row {
  display: flex;
  gap: 6px;
  margin-top: 18px;
  border-top: 1px solid rgba(167,227,246,0.2);
  padding-top: 14px;
}
.member-card-hero .stat {
  flex: 1;
}
.member-card-hero .stat .n {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 22px;
  color: var(--c-cyan-light);
  line-height: 1;
}
.member-card-hero .stat .l {
  font-size: 11.5px;
  color: rgba(255,255,255,0.7);
  margin-top: 4px;
}

.alert-amber {
  background: linear-gradient(180deg, #FFF6E2 0%, #FFEDC7 100%);
  border: 1px solid #F2D58F;
  border-radius: var(--r-lg);
  padding: 18px;
  position: relative;
}
.alert-amber .label {
  display: flex; align-items: center; gap: 8px;
  color: var(--c-amber);
  font-weight: 800;
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.alert-amber .amount {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 30px;
  color: var(--c-text-strong);
  margin: 8px 0 2px;
}
.alert-amber .what {
  font-size: 13.5px;
  color: var(--c-text);
  margin-bottom: 14px;
}
.alert-amber .btn { width: 100%; }

.quick-links {
  background: #fff;
  border: 1px solid var(--c-border);
  border-radius: var(--r-lg);
  overflow: hidden;

.quick-links a {

.activity-feed {

  .kpi-row { grid-template-columns: repeat(2, 1fr); }

  padding: 18px 20px;
}
.avot-mini .pair-line {

  align-items: center;
  gap: 10px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 17px;
  color: var(--c-text-strong);

  color: var(--c-success);
  border-radius: 8px;
  display: grid; place-items: center;

.avot-mini-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 12px;
}

  border: 1px solid #DCE9DF;
  border-radius: 10px;
  padding: 10px 8px;
  text-align: center;
}
.avot-mini-stats .v {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 22px;
  color: var(--c-success);
  line-height: 1;
}
.avot-mini-stats .l {
  font-size: 11px;
  color: var(--c-text-muted);
  margin-top: 4px;
}

/* ---- Points & raffles ---- */

  background: linear-gradient(135deg, #1E4382 0%, #18A1DA 100%);

  justify-content: space-between;
  align-items: center;
  gap: 18px;
  position: relative;
  overflow: hidden;
}
.points-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.16) 1px, transparent 1.5px);
  background-size: 22px 22px;
  pointer-events: none;
  opacity: 0.5;
}
.points-hero > * { position: relative; z-index: 1; }
.points-hero .v {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 56px;
  line-height: 1;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.points-hero .l {
  font-size: 12.5px;
  color: var(--c-cyan-light);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 4px;
}
.points-hero .breakdown {
  font-size: 13px;
  color: rgba(255,255,255,0.85);
  margin-top: 6px;
}
.points-hero .ico-side {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: var(--r-lg);
  padding: 14px;
  display: grid;
  place-items: center;
  color: #fff;
}

.raffle-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
@media (max-width: 720px) { .raffle-grid { grid-template-columns: 1fr; } }

.raffle-card {
  background: #fff;
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.raffle-card .prize {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 15px;
  color: var(--c-text-strong);
  line-height: 1.2;
}
.raffle-card .donor {
  font-size: 12px;
  color: var(--c-text-muted);
}
.raffle-card .meta-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--c-text-muted);
  border-top: 1px dashed var(--c-border-soft);
  padding-top: 8px;
  margin-top: 2px;
}
.raffle-card .entries {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 14px;
  color: var(--c-blue);
  font-variant-numeric: tabular-nums;
}
.raffle-card .enter-btn {
  border: 1px solid var(--c-amber);
  background: rgba(216,139,0,0.06);
  color: var(--c-amber-hover);
  font-weight: 800;
  font-size: 12.5px;
  padding: 6px 12px;
  border-radius: 8px;
  font-family: var(--font-display);
}
.raffle-card .enter-btn.entered {
  background: var(--c-amber);
  color: #fff;
  border-color: var(--c-amber);
}

/* points categories table (admin) */
.cat-row {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr auto;
  gap: 14px;
  align-items: center;
  padding: 12px 0;
  border-top: 1px solid var(--c-border-soft);
}
.cat-row:first-of-type { border-top: none; }
.cat-row .cat-name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
  color: var(--c-text-strong);
}
.cat-row .cat-name .ico {
  display: inline-grid; place-items: center;
  width: 28px; height: 28px;
  background: var(--c-card);
  color: var(--c-blue);
  border-radius: 8px;
  margin-inline-end: 8px;
  vertical-align: middle;
}
.cat-row .cat-stat .v {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 16px;
  color: var(--c-blue);
  font-variant-numeric: tabular-nums;
}
.cat-row .cat-stat .l {
  font-size: 11px;
  color: var(--c-text-muted);
}

/* ---- Aliyot board ---- */
.aliyot-head {
  background: linear-gradient(135deg, #FAF9F5 0%, #FFF9EC 100%);
  border-bottom: 1px solid #F0E4C7;
  padding: 18px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.aliyot-head h3 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 19px;
  color: var(--c-blue-deep);
  margin: 0;
}
.aliyot-head .sub {
  font-size: 13px;
  color: var(--c-text);
  margin-top: 3px;
}
.aliyot-head .parasha-tag {
  background: #fff;
  border: 1px solid #F0E4C7;
  border-radius: 999px;
  padding: 6px 14px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 14px;
  color: var(--c-blue-deep);
}
.aliyot-list {
  padding: 8px 0;
}
.aliyot-row {
  display: grid;
  grid-template-columns: 80px 1fr auto auto;
  gap: 14px;
  padding: 12px 22px;
  align-items: center;
  border-top: 1px solid var(--c-border-soft);
}
.aliyot-row:first-of-type { border-top: none; }
.aliyot-row .ord {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 13px;
  color: var(--c-blue-deep);
  background: var(--c-card);
  border: 1px solid var(--c-border-soft);
  border-radius: 8px;
  padding: 6px 8px;
  text-align: center;
  letter-spacing: 0.04em;
}
.aliyot-row .ord.maftir {
  background: rgba(216,139,0,0.12);
  color: var(--c-amber-hover);
  border-color: rgba(216,139,0,0.3);
}
.aliyot-row .who {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14.5px;
  color: var(--c-text-strong);
}
.aliyot-row .occ {
  font-size: 12px;
  color: var(--c-text-muted);
  margin-top: 2px;
}
.aliyot-row .last {
  font-size: 11.5px;
  color: var(--c-text-muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* very quiet payment link — by design */
.quiet-pay {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  color: var(--c-text-muted);
  text-decoration: none;
  border: 1px solid var(--c-border-soft);
  background: #fff;
  padding: 5px 10px;
  border-radius: 999px;
  font-weight: 600;
  white-space: nowrap;
  transition: all 0.15s ease;
}
.quiet-pay:hover {
  color: var(--c-amber-hover);
  border-color: rgba(216,139,0,0.4);
  background: rgba(216,139,0,0.04);
}
.quiet-pay .dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--c-amber);
  opacity: 0.7;
}

/* queue / tor habba */
.queue-list {
  background: var(--c-card);
  border-radius: var(--r-md);
  padding: 12px 14px;
  margin: 8px 22px 18px;
}
.queue-list h4 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 12.5px;
  color: var(--c-text-muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin: 0 0 8px;
}
.queue-row {
  display: grid;
  grid-template-columns: 24px 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 6px 0;
  font-size: 13px;
}
.queue-row .pos {
  font-family: var(--font-display);
  font-weight: 800;
  color: var(--c-text-muted);
  text-align: center;
}
.queue-row .gap {
  font-size: 11.5px;
  color: var(--c-text-muted);
  font-variant-numeric: tabular-nums;
}

/* member's aliyot mini-card */
.aliyot-mini {
  background: linear-gradient(160deg, #FAF9F5 0%, #FFF9EC 100%);
  border: 1px solid #F0E4C7;
  border-radius: var(--r-lg);
  padding: 18px 20px;
}
.aliyot-mini .row-line {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 8px 0;
  border-top: 1px solid rgba(240,228,199,0.7);
  font-size: 13.5px;
}
.aliyot-mini .row-line:first-of-type { border-top: none; }
.aliyot-mini .row-line .l { color: var(--c-text-muted); }
.aliyot-mini .row-line .v {
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--c-text-strong);
}
.aliyot-mini .pay-row {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed #E5D5A8;
  font-size: 12px;
  color: var(--c-text-muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.aliyot-mini .pay-row .hint {
  font-style: italic;
}
.pay-chips {
  display: inline-flex;
  gap: 6px;
}
.pay-chips a {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 12px;
  color: var(--c-blue-dark);
  background: #fff;
  border: 1px solid var(--c-border);
  padding: 4px 10px;
  border-radius: 999px;
  text-decoration: none;
  font-variant-numeric: tabular-nums;
}
.pay-chips a:hover {
  border-color: var(--c-amber);
  color: var(--c-amber-hover);
}

.biz-admin-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
@media (max-width: 720px) { .biz-admin-grid { grid-template-columns: 1fr; } }

.biz-admin-card {
  background: #fff;
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  padding: 14px;
  display: grid;
  grid-template-columns: 44px 1fr auto;
  gap: 12px;
  align-items: center;
}
.biz-admin-card .ico {
  width: 44px; height: 44px;
  background: var(--c-card);
  color: var(--c-blue);
  border-radius: 10px;
  display: grid; place-items: center;
  border: 1px solid var(--c-border-soft);
}
.biz-admin-card .n {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 14.5px;
  color: var(--c-text-strong);
  line-height: 1.15;
}
.biz-admin-card .meta {
  font-size: 12px;
  color: var(--c-text-muted);
  margin-top: 3px;
}
.biz-admin-card .tag-mini {
  font-size: 10.5px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 4px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.biz-admin-card .tag-mini.app { background: rgba(46,125,91,0.12); color: var(--c-success); }
.biz-admin-card .tag-mini.pend { background: rgba(216,139,0,0.12); color: var(--c-amber-hover); }
.biz-admin-card .menu {
  width: 28px; height: 28px;
  border-radius: 8px;
  border: 1px solid var(--c-border);
  background: #fff;
  display: grid; place-items: center;
  color: var(--c-text-muted);
  cursor: pointer;
}

/* small responsive tweaks for the new bits */
@media (max-width: 1024px) {
  .attendance-grid { grid-template-columns: 160px repeat(6, 1fr); font-size: 11px; }
  .attendance-grid .cell { height: 26px; }
  .points-hero .v { font-size: 44px; }
}
@media (max-width: 720px) {
  .gemach-table th:nth-child(3),
  .gemach-table td:nth-child(3),
  .gemach-table th:nth-child(4),
  .gemach-table td:nth-child(4) { display: none; }
  .gemach-table th, .gemach-table td { padding: 12px 14px; font-size: 12.5px; }

  .attendance-grid .cell { height: 22px; }
  .aliyot-row { grid-template-columns: 60px 1fr auto; padding: 10px 14px; }

  .points-hero { flex-direction: column; align-items: flex-start; padding: 18px; }
  .points-hero .v { font-size: 40px; }
  .queue-list { margin: 8px 14px 14px; }
  .feat-card-head { padding: 14px 16px; }
  .feat-card-pad { padding: 14px 16px; }
}

/* ---- Extra-small phones (≤ 380px) ---- */
@media (max-width: 380px) {
  .kpi-row { grid-template-columns: 1fr; }
  .super-kpi-row { grid-template-columns: 1fr; }
  .super-hero h1 { font-size: 22px; }
}
